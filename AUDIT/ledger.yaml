  implementation_summary: Writes output only after full AEAD verification and element
    restoration succeed.
  test_nodes: tests/integration/test_end_to_end_workflows.py
  evidence_paths: AUDIT/TEST_REPORT.md
  notes: Remediated in v2.3.
- id: F-DICOM-07
  title: Silent corruption from lossy/compressed transfer syntaxes
  severity: Medium
  original_problem: JPEG/RLE compressed transfer syntaxes were unpacked without checking
    support.
  files: medpqc/dicom/handler.py
  required_correction: Explicitly validate transfer syntax; raise UnsupportedTransferSyntaxError.
  implementation_summary: Explicit transfer syntax validation rejecting compressed
    encodings.
  test_nodes: tests/unit/test_dicom_handler.py
  evidence_paths: AUDIT/TEST_REPORT.md
  notes: Validated in handler.
- id: F-DICOM-08
  title: Incomplete deep sequence de-identification
  severity: Medium
