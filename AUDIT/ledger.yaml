findings:
- id: F-HS-01
  title: Handshake unauthenticated mode permitted security bypass
  severity: Critical
  original_problem: Parameter allow_unauthenticated permitted handshake completion
    without verifying peer Ed25519 identity.
  files: medpqc/kem/auth.py, medpqc/dicom/pacs.py
  required_correction: Eliminate allow_unauthenticated entirely; mandate valid TrustStore
    and signed transcripts.
  implementation_summary: Removed parameter from InitiatorContext, ResponderContext,
    and pacs handlers; all handshakes fail closed without trusted peer key.
  test_nodes: tests/adversarial/exploits/test_exploit_d01.py
  evidence_paths: AUDIT/evidence/D-01/after.txt
  notes: Verified in D-01.
- id: F-HS-02
  title: Redundant outer HMAC over AES-GCM ciphertext
  severity: High
  original_problem: Double encryption/MAC construction used redundant outer HMAC over
    already authenticated AES-GCM ciphertext.
  files: medpqc/kem/combiner.py, medpqc/cipher/engine.py
  required_correction: Rely on AES-GCM AEAD authentication tag and bind context properly
    in HKDF.
  implementation_summary: Streamlined AEAD authentication into single SP 800-38D AES-GCM
    construction; directional keys derived via HKDF.
  test_nodes: tests/adversarial/exploits/test_exploit_d09.py
  evidence_paths: AUDIT/evidence/D-09/after.txt
  notes: Streamlined in v2.3.
- id: F-HS-03
  title: Bidirectional symmetric session key reuse
  severity: Critical
  original_problem: Single symmetric key was shared for both initiator-to-responder
    and responder-to-initiator flows.
  files: medpqc/kem/combiner.py, medpqc/kem/auth.py
  required_correction: Derive distinct directional traffic keys (k_enc_i2r, k_enc_r2i)
    bound to session transcript.
  implementation_summary: HKDF derives distinct directional traffic keys with domain-separated
    context tags.
  test_nodes: tests/adversarial/exploits/test_exploit_d05.py
  evidence_paths: AUDIT/evidence/D-05/after.txt
  notes: Hardened in D-05.
- id: F-HS-04
  title: Non-atomic replay protection vulnerable to race conditions
  severity: High
  original_problem: Replay checks checked seen nonces and recorded them non-atomically.
  files: medpqc/security/replay.py
  required_correction: Implement atomic check-and-insert using SQLite single-winner
    constraint or thread-locked memory store.
  implementation_summary: SqliteReplayStore uses atomic INSERT with UNIQUE constraint;
    MemoryReplayStore uses threading.Lock.
  test_nodes: tests/contract/test_replay_store_contract.py, tests/adversarial/exploits/test_exploit_d04.py
  evidence_paths: AUDIT/evidence/D-04/after.txt
  notes: Verified in D-04.
- id: F-HS-05
  title: TrustStore lacked peer lifecycle management
  severity: Medium
  original_problem: No mechanism existed to revoke or rotate trusted peer identity
    keys.
  files: medpqc/security/trust.py
  required_correction: Add rotation, revocation, and node validation methods.
  implementation_summary: Implemented register_peer, revoke_peer, and rotate_peer
    with timestamp audits.
  test_nodes: tests/unit/test_unit_trust.py
  evidence_paths: AUDIT/TEST_REPORT.md
  notes: Completed in v2.3.
- id: F-HS-06
  title: Arbitrary cryptographic suite acceptance by responder
  severity: High
  original_problem: Responder accepted any offered suite string without validating
    against allowed suites.
  files: medpqc/kem/auth.py
  required_correction: Validate offered suite against strict ALLOWED_SUITES set; raise
    UnsupportedSuiteError.
  implementation_summary: Strict set membership check against ALLOWED_SUITES in ResponderContext.
  test_nodes: tests/adversarial/exploits/test_exploit_d02.py
  evidence_paths: AUDIT/evidence/D-02/after.txt
  notes: Verified in D-02.
- id: F-HS-07
  title: Direction confusion in session key derivation
  severity: High
  original_problem: Transcript-derived traffic keys did not enforce strict directional
    bindings.
  files: medpqc/kem/auth.py
  required_correction: Enforce distinct InitiatorCipher and ResponderCipher types
    preventing cross-direction decryptions.
  implementation_summary: InitiatorContext returns InitiatorCipher; ResponderContext
    returns ResponderCipher; cross-direction calls fail closed.
  test_nodes: tests/adversarial/exploits/test_exploit_d05.py
  evidence_paths: AUDIT/evidence/D-05/after.txt
  notes: Verified in D-05.
- id: F-HS-08
  title: Session ID entropy and length validation
  severity: Medium
  original_problem: Short or predictable session IDs were accepted during handshake
    initiation.
  files: medpqc/kem/auth.py
  required_correction: Enforce minimum 16-byte random session ID.
  implementation_summary: Enforced 16-32 byte session_id check with ValueError on
    invalid lengths.
  test_nodes: tests/adversarial/exploits/test_exploit_d03.py
  evidence_paths: AUDIT/evidence/D-03/after.txt
  notes: Verified in D-03.
- id: F-HS-09
  title: Handshake timestamp bounds and replay window checking
  severity: High
  original_problem: Negative timestamps, timestamps far in the past, or future drift
    were accepted without validation.
  files: medpqc/kem/auth.py, medpqc/security/replay.py
  required_correction: Enforce strict uint64 ms timestamp validation against configurable
    replay window (default 300s).
  implementation_summary: Enforced 0 <= timestamp_ms < 2^64-1 and abs(now_ms - timestamp_ms)
    <= window_ms.
  test_nodes: tests/adversarial/exploits/test_exploit_d03.py
  evidence_paths: AUDIT/evidence/D-03/after.txt
  notes: Verified in D-03.
- id: F-ENV-01
  title: Unbounded memory allocation during envelope deserialization
  severity: High
  original_problem: Deserialization of malformed envelopes could exhaust host memory.
  files: medpqc/utils/limits.py, medpqc/utils/canonical.py
  required_correction: Enforce MAX_PAYLOAD_BYTES (1 GB) and MAX_MANIFEST_BYTES (10
    MB).
  implementation_summary: Strict limits enforced across canonical decoder and DICOM
    reader.
  test_nodes: tests/unit/test_unit_limits.py
  evidence_paths: AUDIT/TEST_REPORT.md
  notes: Enforced in v2.3.
- id: F-ENV-02
  title: Missing invocation bounds on AES-GCM nonces
  severity: High
  original_problem: NIST SP 800-38D limits AES-GCM to 2^32 invocations per key to
    prevent nonce collision.
  files: medpqc/cipher/engine.py
  required_correction: Implement session key invocation counter capped at MAX_CIPHERTEXTS_PER_KEY
    (65536).
  implementation_summary: Added invocation counter throwing KeyExhaustedError when
    exceeded.
  test_nodes: tests/unit/test_unit_cipher_limits.py
  evidence_paths: AUDIT/TEST_REPORT.md
  notes: Enforced in v2.3.
- id: F-ENV-03
  title: Non-canonical JSON parsing permitted duplicate keys
  severity: Medium
  original_problem: Standard json.loads silently overwrote duplicate dictionary keys.
  files: medpqc/utils/canonical.py
  required_correction: Implement strict RFC 8785 canonical JSON parser rejecting duplicate
    keys and non-finite floats.
  implementation_summary: Implemented CanonicalDecoder with strict object_pairs_hook.
  test_nodes: tests/fuzz/test_fuzz_manifest.py
  evidence_paths: AUDIT/TEST_REPORT.md
  notes: Enforced in v2.3.
- id: F-ENV-04
  title: In-memory DICOM element bounds check
  severity: Medium
  original_problem: Unbounded DICOM element values could cause memory exhaustion during
    parsing.
  files: medpqc/dicom/handler.py, medpqc/utils/limits.py
  required_correction: Enforce element length and recursion depth caps on nested sequences.
  implementation_summary: Enforced max sequence depth (16) and max element value length.
  test_nodes: tests/unit/test_dicom_handler.py
  evidence_paths: AUDIT/TEST_REPORT.md
  notes: Enforced in handler.
- id: F-ENV-05
  title: Streaming decompression memory exhaustion protection
  severity: Medium
  original_problem: Compressed payloads lacked decompression ratio caps, risking zip-bomb
    conditions.
  files: medpqc/utils/limits.py
  required_correction: Enforce max expansion ratio (100x) and max unpacked buffer
    size.
  implementation_summary: Checked unpacked byte limits prior to processing pixel data.
  test_nodes: tests/unit/test_unit_limits.py
  evidence_paths: AUDIT/TEST_REPORT.md
  notes: Enforced in limits.
- id: F-ENV-06
  title: Envelope header schema validation and critical extension rejection
  severity: Medium
  original_problem: Envelope parser ignored unknown header fields that could alter
    security semantics.
  files: medpqc/utils/canonical.py, medpqc/dicom/pacs.py
  required_correction: Fail closed on unrecognized critical header extensions.
  implementation_summary: Strict schema validation rejects unrecognized keys in manifest
    envelopes.
  test_nodes: tests/unit/test_unit_canonical.py
  evidence_paths: AUDIT/TEST_REPORT.md
  notes: Enforced in canonical.
- id: F-DICOM-01
  title: Dual-source divergence between private tag and sidecar manifest
  severity: High
  original_problem: Security manifest was read from external sidecar or embedded private
    tag with diverging precedence.
  files: medpqc/dicom/pacs.py
  required_correction: Implement Single Authenticated Encrypted Object architecture
    (ADR-001) with explicit source specification.
  implementation_summary: Removed AUTO mode; manifest source must be explicitly declared;
    embedded mode fails closed if tag missing.
  test_nodes: tests/adversarial/exploits/test_exploit_d10.py
  evidence_paths: AUDIT/evidence/D-10/after.txt
  notes: Remediated in D-10.
- id: F-DICOM-02
  title: Silent decryption fallback to external sidecar file
  severity: High
  original_problem: If private DICOM tag was absent, decrypt_dicom_file searched for
    external sidecar on disk.
  files: medpqc/dicom/pacs.py
  required_correction: Eliminate silent fallback; fail closed with MissingManifestError.
  implementation_summary: Fail closed implementation when EMBEDDED manifest is requested
    but tag is missing.
  test_nodes: tests/adversarial/exploits/test_exploit_d10.py
  evidence_paths: AUDIT/evidence/D-10/after.txt
  notes: Verified in D-10.
- id: F-DICOM-03
  title: Retained DICOM headers unauthenticated against dataset hash
  severity: High
  original_problem: Header elements retained in DICOM wrapper were not cryptographically
    bound to ciphertext.
  files: medpqc/dicom/pacs.py
  required_correction: Compute SHA-256 hash of retained dataset elements and bind
    as AAD in AES-GCM.
  implementation_summary: compute_dataset_hash binds normalized header state directly
    into AEAD AAD.
  test_nodes: tests/adversarial/exploits/test_exploit_d14.py
  evidence_paths: AUDIT/evidence/D-14/after.txt
  notes: Verified in D-14.
- id: F-DICOM-04
  title: Default pseudonymization salt permitted cross-site correlation
  severity: High
  original_problem: Hardcoded DEFAULT_SITE_SALT was used if caller did not supply
    custom salt.
  files: medpqc/dicom/pacs.py
  required_correction: Delete DEFAULT_SITE_SALT; require explicit 32-byte SitePseudonymizationKey.
  implementation_summary: Removed default constant; SitePseudonymizationKey requires
    exactly 32 bytes without silent padding.
  test_nodes: tests/adversarial/exploits/test_exploit_d11.py
  evidence_paths: AUDIT/evidence/D-11/after.txt
  notes: Remediated in D-11.
- id: F-DICOM-05
  title: Real clinical imaging artifacts in test directory
  severity: High
  original_problem: Repository contained non-synthetic DICOM files with potential
    privacy risks.
  files: tests_data/
  required_correction: Purge all test artifacts; replace with synthetic generator
    fixtures.
  implementation_summary: Purged non-synthetic DICOM test files; all tests generate
    synthetic data in memory.
  test_nodes: tests/contract/test_dicom_roundtrip_contract.py
  evidence_paths: AUDIT/TEST_REPORT.md
  notes: Purged in v2.3.
- id: F-DICOM-06
  title: Partial file leakage on decryption failure
  severity: High
  original_problem: Failed decryption left partially-written unauthenticated files
    on disk.
  files: medpqc/dicom/pacs.py
  required_correction: Use atomic write to temporary file with mandatory try/finally
