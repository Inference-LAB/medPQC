[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medpqc"
version = "1.1.0"
description = "High-Performance Authenticated Hybrid Post-Quantum Medical Image Encryption and PACS Framework"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Muhammad Khubaib Ahmad", email = "khubaib.ahmad@inference-lab.org"},
    {name = "Muhammad Khubaib Ahmad", email = "muhammadkhubaibahmad854@gmail.com"},
    {name = "Muzammil Shadab", email = "muzammil.shadab@inference-lab.org"}
]
keywords = [
    "medical-image-encryption",
    "post-quantum-cryptography",
    "ml-kem-768",
    "fips-203",
    "authenticated-key-exchange",
    "dicom-security",
    "pacs-protection",
    "authenticated-encryption"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Medical Science Apps."
]
dependencies = [
    "numpy>=1.22.0",
    "cryptography>=38.0.0",
    "mlkem>=0.2.0,<1.0.0"
]

[project.optional-dependencies]
dicom = [
    "pydicom>=2.3.0",
    "opencv-python-headless>=4.5.0"
]
chaos = [
    "numba>=0.56.0",
    "scipy>=1.8.0"
]
bench = [
    "matplotlib>=3.5.0"
]
pqc = [
    "liboqs-python>=0.8.0"
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "build>=1.0.0",
    "hypothesis>=6.80.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "bandit>=1.7.0"
]
all = [
    "pydicom>=2.3.0",
    "opencv-python-headless>=4.5.0",
    "numba>=0.56.0",
    "scipy>=1.8.0",
    "matplotlib>=3.5.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "hypothesis>=6.80.0"
]

[project.urls]
Homepage = "https://github.com/Inference-Lab/medPQC"
Repository = "https://github.com/Inference-Lab/medPQC"
Issues = "https://github.com/Inference-Lab/medPQC/issues"

[tool.setuptools.packages.find]
include = ["medpqc*"]
exclude = ["tests*", "examples*", "tests_data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "redteam_*.py"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["medpqc"]
branch = true
omit = [
    "*/tests/*",
    "*/examples/*",
    "*/benchmarks/*"
]

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
strict = true
ignore_missing_imports = true
files = ["medpqc"]
